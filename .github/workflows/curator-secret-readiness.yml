name: Curator Secret and Sandbox Readiness

on:
  workflow_dispatch:
  push:
    branches:
      - agent/curator-secret-readiness
    paths:
      - ".github/workflows/curator-secret-readiness.yml"
      - "scripts/check_curator_runtime.py"
      - "scripts/validate_curator_secret_readiness.py"
      - "tests/test_curator_secret_readiness_workflow.py"
      - "tests/test_validate_curator_secret_readiness.py"

permissions:
  contents: read

concurrency:
  group: curator-secret-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-curator-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CURATOR_AGENT_URL: http://127.0.0.1:8010
      CURATOR_AGENT_API_KEY: ${{ secrets.CURATOR_AGENT_API_KEY }}
      CURATOR_EXECUTE_API_KEY: ${{ secrets.CURATOR_AGENT_API_KEY }}
      CURATOR_ADMIN_API_KEY: ${{ secrets.CURATOR_ADMIN_API_KEY }}
      CURATOR_DB_PATH: /tmp/manager-curator-secret-readiness.sqlite3
      CURATOR_REQUIRE_API_KEY: "true"
      CURATOR_CONTAINER_SANDBOX_ENABLED: "true"
      CURATOR_CONTAINER_SANDBOX_FALLBACK: "false"
      CURATOR_SANDBOX_IMAGE: curator-skill-sandbox:manager-readiness

    steps:
      - name: Checkout Manager_Agent
        uses: actions/checkout@v4
        with:
          path: Manager_Agent

      - name: Checkout Curator_Agent main
        uses: actions/checkout@v4
        with:
          repository: athipan1/Curator_Agent
          ref: main
          path: Curator_Agent
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate managed Curator secrets
        working-directory: Manager_Agent
        run: python scripts/validate_curator_secret_readiness.py

      - name: Install Curator dependencies
        working-directory: Curator_Agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build hardened sandbox image
        working-directory: Curator_Agent
        run: docker build -t "$CURATOR_SANDBOX_IMAGE" -f sandbox/Dockerfile .

      - name: Start Curator on the Docker host
        working-directory: Curator_Agent
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8010 \
            > /tmp/manager-curator-secret-readiness.log 2>&1 &
          echo $! > /tmp/manager-curator-secret-readiness.pid

      - name: Verify secure readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8010/ready > /tmp/curator-ready.json; then
              python - <<'PY'
          import json

          with open('/tmp/curator-ready.json', encoding='utf-8') as handle:
              payload = json.load(handle)

          execution = payload['data']['execution']
          assert payload['data']['ready'] is True, payload
          assert execution['mode'] == 'container', payload
          assert execution['secure_execution_ready'] is True, payload
          assert execution['image'] == 'curator-skill-sandbox:manager-readiness', payload
          assert execution.get('fallback_enabled') is not True, payload
          PY
              exit 0
            fi
            sleep 2
          done
          cat /tmp/manager-curator-secret-readiness.log
          exit 1

      - name: Verify role boundaries and isolated execution
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = os.environ['CURATOR_AGENT_URL']
          execute_key = os.environ['CURATOR_AGENT_API_KEY']
          admin_key = os.environ['CURATOR_ADMIN_API_KEY']

          def request(method, path, key=None, payload=None):
              headers = {'X-Correlation-ID': 'manager-curator-secret-readiness'}
              if key:
                  headers['X-API-KEY'] = key
              body = None
              if payload is not None:
                  headers['Content-Type'] = 'application/json'
                  body = json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  base + path,
                  data=body,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return response.status, json.loads(response.read().decode('utf-8'))
              except urllib.error.HTTPError as exc:
                  return exc.code, json.loads(exc.read().decode('utf-8'))

          status, body = request('GET', '/skills')
          assert status == 401, body

          status, body = request(
              'POST',
              '/skills/register',
              execute_key,
              {
                  'name': 'Forbidden execute-key registration',
                  'description': 'Execute-role credentials must not mutate lifecycle state.',
                  'code': "def signal():\n    return {'signal': 'hold'}",
              },
          )
          assert status == 403, body

          status, registered = request(
              'POST',
              '/skills/register',
              admin_key,
              {
                  'name': 'Manager Curator Secret Readiness Skill',
                  'description': 'Harmless advisory skill executed in the isolated container.',
                  'code': (
                      "def signal(price):\n"
                      "    return {'signal': 'hold', 'confidence': 0.5, "
                      "'reason': 'secret readiness verified', 'price': price}"
                  ),
                  'input_schema': {
                      'type': 'object',
                      'required': ['price'],
                      'properties': {'price': {'type': 'number'}},
                      'additionalProperties': False,
                  },
                  'output_schema': {
                      'type': 'object',
                      'required': ['signal', 'confidence', 'reason', 'price'],
                      'properties': {
                          'signal': {'type': 'string'},
                          'confidence': {'type': 'number'},
                          'reason': {'type': 'string'},
                          'price': {'type': 'number'},
                      },
                      'additionalProperties': False,
                  },
              },
          )
          assert status == 200, registered
          skill_id = registered['data']['skill_id']

          status, approved = request(
              'POST',
              f'/skills/{skill_id}/approve',
              admin_key,
              {'approved_by': 'github-actions', 'reason': 'managed-secret readiness'},
          )
          assert status == 200, approved

          status, executed = request(
              'POST',
              f'/skills/{skill_id}/execute',
              execute_key,
              {'inputs': {'price': 90}, 'timeout_seconds': 2.0},
          )
          assert status == 200, executed
          data = executed['data']
          assert data['execution_status'] == 'success', executed
          assert data['output']['signal'] == 'hold', executed
          assert data['sandbox']['mode'] == 'container', executed
          assert data.get('fallback_used') is not True, executed
          assert data['sandbox']['network_access'] is False, executed
          assert data['sandbox']['read_only_filesystem'] is True, executed
          PY

      - name: Run Manager authenticated Curator smoke flow
        working-directory: Manager_Agent
        run: python scripts/check_curator_runtime.py

      - name: Show Curator diagnostics on failure
        if: failure()
        run: |
          cat /tmp/curator-ready.json || true
          cat /tmp/manager-curator-secret-readiness.log || true
          docker ps -a || true

      - name: Stop Curator
        if: always()
        run: |
          if [ -f /tmp/manager-curator-secret-readiness.pid ]; then
            kill "$(cat /tmp/manager-curator-secret-readiness.pid)" || true
          fi
