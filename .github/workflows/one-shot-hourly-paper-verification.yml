name: One-shot Hourly Paper Verification

on:
  push:
    branches:
      - verify/hourly-paper-ef21
    paths:
      - .github/workflows/one-shot-hourly-paper-verification.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-hourly-paper-verification.yml

permissions:
  contents: read
  issues: read

jobs:
  verify-hourly-paper:
    uses: ./.github/workflows/hourly-auto-trading.yml
    with:
      dry_run: false
      broker_mode: ALPACA
      max_universe: "1000"
      top_n: "10"
      min_final_score: "0.55"
      operator_confirmation: "EXECUTE_ALPACA_PAPER"
      emergency_halt_drill: false
      authorized_soak_schedule: false
    secrets: inherit

# Temporary verification-only caller. Alpaca PAPER only; do not merge.
