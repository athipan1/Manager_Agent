name: Export Finalized Hourly Simulator Fix

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-dispatch-hourly-simulator.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Build finalized files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/hourly-auto-trading.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          start = workflow.index('      - name: Record safe no-candidate cycle\n')
          end = workflow.index('      - name: Run Manager candidate, Risk and guarded Execution cycle\n', start)
          replacement = '''      - name: Record safe no-candidate cycle
                  if: steps.scanner_preselection.outputs.backtest_symbols == ''
                  working-directory: Manager_Agent
                  run: python scripts/record_no_candidate_cycle.py

          '''
          workflow_path.write_text(workflow[:start] + replacement + workflow[end:], encoding='utf-8')

          helper = '''#!/usr/bin/env python3
          """Record a successful no-op hourly cycle when Scanner selects no symbols."""

          from __future__ import annotations

          import json
          from pathlib import Path


          def build_no_candidate_report(preflight: dict) -> dict:
              return {
                  "execute_requested": False,
                  "market_mode": preflight.get("market_mode"),
                  "reason": "no_preselected_backtest_symbols",
                  "manager_response": {
                      "status": "success",
                      "data": {
                          "execution": {
                              "status": "not_attempted",
                              "reason": "no_preselected_backtest_symbols",
                          },
                          "portfolio_summary": {
                              "approved_positions": 0,
                              "execution_status": "not_attempted",
                          },
                      },
                  },
              }


          def main() -> int:
              preflight_path = Path("reports/hourly-preflight.json")
              output_path = Path("reports/hourly-manager-cycle.json")
              preflight = json.loads(preflight_path.read_text(encoding="utf-8"))
              if preflight.get("status") != "ready" or not preflight.get("portfolio_cycle_id"):
                  raise ValueError("Hourly preflight must be ready before recording a no-candidate cycle")
              output_path.parent.mkdir(parents=True, exist_ok=True)
              output_path.write_text(
                  json.dumps(build_no_candidate_report(preflight), ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )
              print("No preselected symbols passed the safety gates; recorded a successful no-op cycle.")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          '''
          Path('scripts/record_no_candidate_cycle.py').write_text(
              '\n'.join(line[10:] if line.startswith('          ') else line for line in helper.splitlines()) + '\n',
              encoding='utf-8',
          )

          test_path = Path('tests/test_configure_simulator_runtime.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace('counter = iter(("exec", "database", "portfolio", "risk"))', 'counter = iter(("exec", "database", "portfolio", "risk", "profit"))')
          tests = tests.replace('        "RISK_ADMIN_TOKEN",\n        "SIMULATOR_RUNTIME_KEYS_EPHEMERAL",', '        "RISK_ADMIN_TOKEN",\n        "PROFIT_AGENT_API_KEY",\n        "SIMULATOR_RUNTIME_KEYS_EPHEMERAL",')
          tests = tests.replace('    assert values["RISK_ADMIN_TOKEN"] == "sim-risk-risk"\n', '    assert values["RISK_ADMIN_TOKEN"] == "sim-risk-risk"\n    assert values["PROFIT_AGENT_API_KEY"] == "sim-profit-profit"\n')
          tests = tests.replace(' == 4\n', ' == 5\n')
          test_path.write_text(tests, encoding='utf-8')
          PY

          mkdir -p finalized/scripts finalized/tests
          cp .github/workflows/hourly-auto-trading.yml finalized/hourly-auto-trading.yml
          cp scripts/record_no_candidate_cycle.py finalized/scripts/
          cp tests/test_configure_simulator_runtime.py finalized/tests/

      - name: Upload finalized files
        uses: actions/upload-artifact@v4
        with:
          name: finalized-hourly-simulator-fix-v2
          path: finalized/
          retention-days: 1
