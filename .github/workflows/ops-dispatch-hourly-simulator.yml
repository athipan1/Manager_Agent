name: Ops Diagnose Manager Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-dispatch-hourly-simulator.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'athipan1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print Manager runtime traceback only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_RUN_ID: "30151352039"
          TARGET_JOB_ID: "89662154600"
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$TARGET_RUN_ID" --repo "$REPO" --job "$TARGET_JOB_ID" --log > job.log
          echo "=== MANAGER RUNTIME CONTAINER ==="
          grep -E "manager-agent-1|manager_agent-manager-agent-1" job.log | tail -n 100 || true
          echo "=== FAILURE TIME WINDOW ==="
          grep -E "08:39:|08:40:" job.log | grep -Ei "manager|traceback|exception|error|500|discover|failed" | tail -n 100 || true
