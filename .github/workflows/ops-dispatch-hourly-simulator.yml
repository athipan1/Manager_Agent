name: Ops Diagnose Failure Step

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-dispatch-hourly-simulator.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'athipan1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print fail-closed container diagnostics only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_RUN_ID: "30151352039"
          TARGET_JOB_ID: "89662154600"
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$TARGET_RUN_ID" --repo "$REPO" --job "$TARGET_JOB_ID" --log > job.log
          awk -F '\t' '$2 == "Show fail-closed diagnostics" {print}' job.log > diagnostics.log
          echo "=== FAILURE STEP ERROR LINES ==="
          grep -Ei "manager|traceback|exception|error|500|discover|failed|validation|keyerror|typeerror" diagnostics.log | tail -n 100 || true
          echo "=== FAILURE STEP TAIL ==="
          tail -n 100 diagnostics.log
