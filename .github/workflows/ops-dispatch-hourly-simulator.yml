name: Ops Diagnose Patched Hourly Simulator

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-dispatch-hourly-simulator.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'athipan1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print concise patched failure diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_RUN_ID: "30151128012"
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$TARGET_RUN_ID" --repo "$REPO" --log-failed > failed.log
          echo "=== ERROR MATCHES ==="
          grep -Ei "RuntimeSafetyError|not ready|connection|refused|unauthorized|forbidden|traceback|error|failed" failed.log | tail -n 40 || true
          echo "=== FINAL 45 LINES ==="
          tail -n 45 failed.log
