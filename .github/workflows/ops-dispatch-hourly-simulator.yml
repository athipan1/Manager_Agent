name: Diagnose Finalizer Push

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-dispatch-hourly-simulator.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Print failed commit step
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view 30157463829 --repo "$REPO" --log-failed > failed.log
          grep -Ei "remote:|error:|fatal:|denied|refusing|workflow|permission|protected|push" failed.log | tail -n 80 || true
          tail -n 80 failed.log
