name: Ops Diagnose Manager Container

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-dispatch-hourly-simulator.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'athipan1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print Manager container diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_RUN_ID: "30151352039"
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$TARGET_RUN_ID" --repo "$REPO" --log > full.log
          echo "=== MANAGER ERROR MATCHES ==="
          grep -Ei "discover-analyze-trade|manager-agent.*(error|exception|traceback|500|failed)|Traceback|ValidationError|KeyError|TypeError|RuntimeError" full.log | tail -n 120 || true
          echo "=== FAILURE DIAGNOSTICS TAIL ==="
          awk '/Show fail-closed diagnostics/{show=1} show{print}' full.log | tail -n 180 || true
