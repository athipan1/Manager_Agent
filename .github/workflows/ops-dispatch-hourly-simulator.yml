name: Ops Diagnose Hourly Simulator

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-dispatch-hourly-simulator.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'athipan1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print failed target logs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_RUN_ID: "30150834103"
        shell: bash
        run: |
          set -euo pipefail
          echo "Target: https://github.com/$REPO/actions/runs/$TARGET_RUN_ID"
          gh run view "$TARGET_RUN_ID" --repo "$REPO" --log-failed
