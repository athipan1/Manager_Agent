name: Ops Diagnose Manager Trace

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-dispatch-hourly-simulator.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'athipan1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print exact Manager trace
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_RUN_ID: "30151352039"
          TARGET_JOB_ID: "89662154600"
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$TARGET_RUN_ID" --repo "$REPO" --job "$TARGET_JOB_ID" --log > job.log
          echo "=== MANAGER CONTAINER LINES ==="
          grep -Ei "manager-agent|discover-analyze-trade|Traceback|Exception|ValidationError|KeyError|TypeError|HTTP/1.1 500" job.log | tail -n 260 || true
