name: Scanner Manager Real-Market Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "app/scanner_client.py"
      - "app/contracts/scanner.py"
      - "app/services/scanner_data_quality_service.py"
      - "docker-compose.hourly-paper.yml"
      - "docker-compose.hourly-simulator.yml"
      - "tests/test_scanner_data_quality_gate.py"
      - "tests/test_scanner_real_market_contract.py"
      - ".github/workflows/scanner-manager-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manager-to-scanner:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}

    steps:
      - name: Checkout Manager_Agent
        uses: actions/checkout@v4
        with:
          path: Manager_Agent

      - name: Checkout Scanner_Agent main
        uses: actions/checkout@v4
        with:
          repository: athipan1/Scanner_Agent
          ref: main
          path: Scanner_Agent
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Alpaca Paper credentials
        run: |
          set -euo pipefail
          if [ -z "${APCA_API_KEY_ID}" ] || [ -z "${APCA_API_SECRET_KEY}" ]; then
            echo "ALPACA_API_KEY_ID and ALPACA_SECRET_KEY repository secrets are required."
            exit 1
          fi

      - name: Install Manager client dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Manager_Agent/requirements.prod.base.txt

      - name: Build Scanner_Agent image
        working-directory: Scanner_Agent
        run: docker build -t scanner-manager-contract:latest .

      - name: Start production-mode Scanner_Agent
        run: |
          docker run -d \
            --name scanner-manager-contract \
            -p 8003:8003 \
            -e SCANNER_DEV_MODE=false \
            -e TRADING_MODE=PAPER \
            -e APCA_API_KEY_ID \
            -e APCA_API_SECRET_KEY \
            scanner-manager-contract:latest

      - name: Wait for Scanner_Agent
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:8003/health >/dev/null; then
              echo "Scanner_Agent is healthy."
              exit 0
            fi
            sleep 3
          done
          docker logs scanner-manager-contract || true
          exit 1

      - name: Run Manager client against real Scanner
        working-directory: Manager_Agent
        env:
          SCANNER_AGENT_URL: http://localhost:8003
          SCANNER_REQUIRE_REAL_MARKET_DATA: "true"
          SCANNER_MIN_DATA_COVERAGE: "0.80"
          SCANNER_OPPORTUNITY_PROFILE_REQUIRED: "true"
          SCANNER_SCREENER: america
          SCANNER_EXCHANGE: NASDAQ
          AGENT_CLIENT_TIMEOUT: "60"
          AGENT_CLIENT_MAX_RETRIES: "1"
          TRADING_MODE: PAPER
          ALLOW_LIVE_TRADING: "false"
        run: |
          python - <<'PY'
          import asyncio

          from app.scanner_client import ScannerAgentClient

          SYMBOLS = [
              "AAPL", "MSFT", "NVDA", "GOOGL", "AMZN",
              "META", "TSLA", "AMD", "AVGO", "NFLX",
          ]

          def to_dict(value):
              if isinstance(value, dict):
                  return value
              if hasattr(value, "model_dump"):
                  return value.model_dump(mode="json")
              return {}

          def assert_quality_outcome(name, response):
              data = to_dict(response.data)
              candidates = data.get("candidates") or []
              review = data.get("review_candidates") or []
              metadata = data.get("metadata") or {}
              quality_gate = metadata.get("scanner_data_quality_gate") or {}
              opportunity_gate = metadata.get("scanner_opportunity_gate") or {}

              if any(row.get("decision") != "REVIEW" for row in review):
                  raise RuntimeError(f"{name} returned malformed REVIEW rows: {review}")

              if candidates:
                  quality_passed = quality_gate.get("passed_count")
                  if quality_passed is not None and quality_passed < len(candidates):
                      raise RuntimeError(
                          f"{name} quality gate pass count cannot be below final candidates: "
                          f"quality={quality_gate} final={len(candidates)}"
                      )
                  if opportunity_gate:
                      if opportunity_gate.get("passed_count") != len(candidates):
                          raise RuntimeError(
                              f"{name} opportunity gate pass count mismatch: "
                              f"{opportunity_gate}"
                          )
                  elif quality_passed != len(candidates):
                      raise RuntimeError(
                          f"{name} legacy quality gate pass count mismatch: {quality_gate}"
                      )
                  print(
                      f"{name}: PASS candidates={len(candidates)} "
                      f"review={len(review)} correlation_id={response.correlation_id}"
                  )
                  return

              if review:
                  quality_review = quality_gate.get("decision") == "REVIEW"
                  opportunity_review = opportunity_gate.get("decision") == "REVIEW"
                  if not quality_review and not opportunity_review:
                      raise RuntimeError(
                          f"{name} expected REVIEW from data-quality or opportunity gate: "
                          f"quality={quality_gate} opportunity={opportunity_gate}"
                      )
                  reason_codes = sorted(
                      set(quality_gate.get("review_reason_codes") or [])
                      | set(opportunity_gate.get("review_reason_codes") or [])
                  )
                  sources = []
                  if quality_review:
                      sources.append("data_quality")
                  if opportunity_review:
                      sources.append("opportunity")
                  print(
                      f"{name}: fail-safe REVIEW candidates={len(review)} "
                      f"sources={sources} codes={reason_codes}"
                  )
                  return

              raise RuntimeError(
                  f"{name} scan returned neither passed nor REVIEW candidates"
              )

          async def main():
              async with ScannerAgentClient() as client:
                  technical = await client.scan(
                      SYMBOLS,
                      "manager-scanner-technical-contract",
                  )
                  fundamental = await client.scan_fundamental(
                      SYMBOLS,
                      "manager-scanner-fundamental-contract",
                  )

              for name, response in (
                  ("technical", technical),
                  ("fundamental", fundamental),
              ):
                  assert_quality_outcome(name, response)

          asyncio.run(main())
          PY

      - name: Fail on hidden Scanner provider or dataframe errors
        run: |
          docker logs scanner-manager-contract > scanner-manager-contract.log 2>&1
          if grep -Eiq \
            "401 Authorization Required|unauthorized|Exchange or symbol not found|truth value of a Series is ambiguous|FutureWarning: Calling float on a single element Series" \
            scanner-manager-contract.log; then
            cat scanner-manager-contract.log
            exit 1
          fi

      - name: Show Scanner logs
        if: always()
        run: docker logs scanner-manager-contract || true

      - name: Stop Scanner_Agent
        if: always()
        run: docker rm -f scanner-manager-contract || true
