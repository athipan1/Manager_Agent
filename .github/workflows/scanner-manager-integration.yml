name: Scanner Manager Real-Market Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "app/scanner_client.py"
      - "app/contracts/scanner.py"
      - "app/services/scanner_data_quality_service.py"
      - "app/services/scanner_opportunity_service.py"
      - "app/services/shadow_trading_service.py"
      - "scripts/run_hourly_shadow_lane.py"
      - "docker-compose.hourly-paper.yml"
      - "docker-compose.hourly-simulator.yml"
      - "tests/test_scanner_data_quality_gate.py"
      - "tests/test_scanner_real_market_contract.py"
      - ".github/workflows/scanner-manager-integration.yml"
  workflow_dispatch:
  schedule:
    # 15:05 UTC is safely inside US regular hours in both EDT and EST.
    - cron: "5 15 * * 1-5"

permissions:
  contents: read

jobs:
  manager-to-scanner:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      REQUIRE_REGULAR_SESSION: ${{ github.event_name == 'schedule' && 'true' || 'false' }}

    steps:
      - name: Checkout Manager_Agent
        uses: actions/checkout@v6
        with:
          path: Manager_Agent

      - name: Checkout Scanner_Agent evidence revision
        uses: actions/checkout@v6
        with:
          repository: athipan1/Scanner_Agent
          ref: ${{ github.event_name == 'pull_request' && 'agent/scanner-opportunity-evidence-v2' || 'main' }}
          path: Scanner_Agent
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify canonical Alpaca Paper credentials
        run: |
          set -euo pipefail
          if [ -z "${APCA_API_KEY_ID}" ] || [ -z "${APCA_API_SECRET_KEY}" ]; then
            echo "Manager ALPACA_API_KEY_ID and ALPACA_SECRET_KEY repository secrets are required."
            exit 1
          fi
          echo "Using Manager canonical Alpaca credentials for Scanner integration."

      - name: Install Manager client dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Manager_Agent/requirements.prod.base.txt

      - name: Build Scanner_Agent image
        working-directory: Scanner_Agent
        run: docker build -t scanner-manager-contract:latest .

      - name: Start production-mode Scanner_Agent
        run: |
          docker run -d \
            --name scanner-manager-contract \
            -p 8003:8003 \
            -e SCANNER_DEV_MODE=false \
            -e TRADING_MODE=PAPER \
            -e APCA_API_KEY_ID \
            -e APCA_API_SECRET_KEY \
            scanner-manager-contract:latest

      - name: Wait for Scanner_Agent
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:8003/health >/dev/null; then
              echo "Scanner_Agent is healthy."
              exit 0
            fi
            sleep 3
          done
          docker logs scanner-manager-contract || true
          exit 1

      - name: Run Manager client against real Scanner
        working-directory: Manager_Agent
        env:
          SCANNER_AGENT_URL: http://localhost:8003
          SCANNER_REQUIRE_REAL_MARKET_DATA: "true"
          SCANNER_MIN_DATA_COVERAGE: "0.80"
          SCANNER_SCREENER: america
          SCANNER_EXCHANGE: NASDAQ
          AGENT_CLIENT_TIMEOUT: "60"
          AGENT_CLIENT_MAX_RETRIES: "1"
          TRADING_MODE: PAPER
          ALLOW_LIVE_TRADING: "false"
        run: |
          python - <<'PY'
          import asyncio

          from app.scanner_client import ScannerAgentClient

          SYMBOLS = [
              "AAPL", "MSFT", "NVDA", "GOOGL", "AMZN",
              "META", "TSLA", "AMD", "AVGO", "NFLX",
          ]

          def to_dict(value):
              if isinstance(value, dict):
                  return value
              if hasattr(value, "model_dump"):
                  return value.model_dump(mode="json")
              return {}

          def assert_quality_outcome(name, response):
              data = to_dict(response.data)
              candidates = data.get("candidates") or []
              review = data.get("review_candidates") or []
              metadata = data.get("metadata") or {}
              quality_gate = metadata.get("scanner_data_quality_gate") or {}
              opportunity_gate = metadata.get("scanner_opportunity_gate") or {}

              if any(row.get("decision") != "REVIEW" for row in review):
                  raise RuntimeError(f"{name} returned malformed REVIEW rows: {review}")

              if candidates:
                  if int(quality_gate.get("passed_count") or 0) < len(candidates):
                      raise RuntimeError(
                          f"{name} quality gate pass count mismatch: {quality_gate}"
                      )
                  if (
                      opportunity_gate
                      and int(opportunity_gate.get("passed_count") or 0) != len(candidates)
                  ):
                      raise RuntimeError(
                          f"{name} opportunity gate pass count mismatch: {opportunity_gate}"
                      )
                  print(
                      f"{name}: PASS candidates={len(candidates)} review={len(review)} "
                      f"quality={quality_gate.get('decision')} "
                      f"opportunity={opportunity_gate.get('decision')} "
                      f"correlation_id={response.correlation_id}"
                  )
                  return

              if review:
                  quality_review = quality_gate.get("decision") == "REVIEW"
                  opportunity_review = opportunity_gate.get("decision") == "REVIEW"
                  if not (quality_review or opportunity_review):
                      raise RuntimeError(
                          f"{name} review candidates lack a REVIEW gate summary: "
                          f"quality={quality_gate}, opportunity={opportunity_gate}"
                      )
                  codes = sorted(
                      set(quality_gate.get("review_reason_codes") or [])
                      | set(opportunity_gate.get("review_reason_codes") or [])
                  )
                  print(
                      f"{name}: REVIEW candidates={len(review)} codes={codes} "
                      f"quality={quality_gate.get('decision')} "
                      f"opportunity={opportunity_gate.get('decision')}"
                  )
                  return

              raise RuntimeError(
                  f"{name} scan returned neither quality-passed nor REVIEW candidates"
              )

          async def main():
              async with ScannerAgentClient() as client:
                  technical = await client.scan(
                      SYMBOLS,
                      "manager-scanner-technical-contract",
                  )
                  fundamental = await client.scan_fundamental(
                      SYMBOLS,
                      "manager-scanner-fundamental-contract",
                  )

              for name, response in (
                  ("technical", technical),
                  ("fundamental", fundamental),
              ):
                  assert_quality_outcome(name, response)

          asyncio.run(main())
          PY

      - name: Verify opportunity evidence coverage and Alpaca auth
        run: |
          mkdir -p Manager_Agent/reports
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          from pathlib import Path

          SYMBOLS = [
              "AAPL", "MSFT", "NVDA", "GOOGL", "AMZN",
              "META", "TSLA", "AMD", "AVGO", "NFLX",
          ]
          require_regular = os.getenv("REQUIRE_REGULAR_SESSION", "false").lower() == "true"
          request = urllib.request.Request(
              "http://localhost:8003/scan",
              data=json.dumps({
                  "symbols": SYMBOLS,
                  "screener": "default",
                  "exchange": "US",
              }).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "X-Correlation-ID": "manager-canonical-scanner-smoke",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=180) as response:
              body = json.loads(response.read().decode("utf-8"))

          candidates = ((body.get("data") or {}).get("candidates") or [])
          if not candidates:
              raise RuntimeError("Scanner returned no technical candidates")

          evidence_rows = []
          for candidate in candidates:
              metadata = candidate.get("metadata") or {}
              details = metadata.get("details") or {}
              bundle = details.get("data_bundle") or metadata.get("data_bundle") or {}
              profile = bundle.get("opportunity_profile") or {}
              evidence = profile.get("evidence_quality") or {}
              context = profile.get("execution_context") or {}
              snapshot = bundle.get("market_snapshot") or {}
              alpaca_errors = [
                  item for item in (snapshot.get("provider_errors") or [])
                  if isinstance(item, dict) and item.get("provider") == "alpaca"
              ]
              evidence_rows.append({
                  "symbol": candidate.get("symbol"),
                  "status": profile.get("status"),
                  "workflow_status": profile.get("workflow_status"),
                  "coverage_ratio": evidence.get("coverage_ratio"),
                  "atr_available": evidence.get("atr_available"),
                  "relative_volume_available": evidence.get("relative_volume_available"),
                  "spread_available": evidence.get("spread_available"),
                  "quote_timestamp_available": evidence.get("quote_timestamp_available"),
                  "liquid_spread_sane": evidence.get("liquid_spread_sane"),
                  "spread_structurally_valid": evidence.get("spread_structurally_valid"),
                  "quote_status": context.get("quote_status"),
                  "market_session": context.get("market_session"),
                  "alpaca_status": (snapshot.get("provider_status") or {}).get("alpaca"),
                  "alpaca_error_count": len(alpaca_errors),
              })

          count = len(evidence_rows)
          atr_coverage = sum(row["atr_available"] is True for row in evidence_rows) / count
          rvol_coverage = sum(row["relative_volume_available"] is True for row in evidence_rows) / count
          alpaca_coverage = sum(
              row["alpaca_status"] == "success" and row["alpaca_error_count"] == 0
              for row in evidence_rows
          ) / count
          spread_sanity = all(
              row["spread_structurally_valid"] is True
              and row["liquid_spread_sane"] is True
              for row in evidence_rows
          )

          failures = []
          if atr_coverage < 0.95:
              failures.append(f"ATR coverage {atr_coverage:.1%} < 95%")
          if rvol_coverage < 0.95:
              failures.append(f"relative-volume coverage {rvol_coverage:.1%} < 95%")
          if alpaca_coverage < 0.95:
              failures.append(f"Alpaca provider success {alpaca_coverage:.1%} < 95%")
          if not spread_sanity:
              failures.append("liquid spread sanity failed")

          regular = [row for row in evidence_rows if row["market_session"] == "regular"]
          if require_regular and len(regular) != count:
              failures.append("scheduled run did not observe regular US session for all candidates")
          if regular:
              bad_quotes = [
                  row["symbol"] for row in regular
                  if row["quote_status"] != "fresh"
                  or row["spread_available"] is not True
                  or row["quote_timestamp_available"] is not True
              ]
              if bad_quotes:
                  failures.append(
                      "regular-session quote evidence is stale/incomplete: "
                      + ", ".join(str(symbol) for symbol in bad_quotes)
                  )

          report = {
              "require_regular_session": require_regular,
              "candidate_count": count,
              "atr_coverage": round(atr_coverage, 4),
              "relative_volume_coverage": round(rvol_coverage, 4),
              "alpaca_success_coverage": round(alpaca_coverage, 4),
              "liquid_spread_sanity_passed": spread_sanity,
              "evidence": evidence_rows,
              "failures": failures,
          }
          Path("Manager_Agent/reports/scanner-canonical-auth-evidence.json").write_text(
              json.dumps(report, indent=2), encoding="utf-8"
          )
          print(json.dumps(report, indent=2))
          if failures:
              for failure in failures:
                  print(f"- {failure}", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Fail on hidden Scanner provider or dataframe errors
        run: |
          docker logs scanner-manager-contract > Manager_Agent/reports/scanner-manager-contract.log 2>&1
          if grep -Eiq \
            "401 Authorization Required|403 Forbidden|unauthorized|Exchange or symbol not found|truth value of a Series is ambiguous|FutureWarning: Calling float on a single element Series" \
            Manager_Agent/reports/scanner-manager-contract.log; then
            cat Manager_Agent/reports/scanner-manager-contract.log
            exit 1
          fi

      - name: Upload Scanner integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scanner-manager-real-market-evidence
          path: Manager_Agent/reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Show Scanner logs
        if: always()
        run: docker logs scanner-manager-contract || true

      - name: Stop Scanner_Agent
        if: always()
        run: docker rm -f scanner-manager-contract || true
