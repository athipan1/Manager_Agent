name: Profitability Funnel Audit

on:
  workflow_run:
    workflows:
      - Hourly Auto Trading
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: profitability-funnel-audit-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Manager_Agent
        uses: actions/checkout@v6

      - name: Checkout Backtest_Agent diagnostics
        uses: actions/checkout@v6
        with:
          repository: athipan1/Backtest_Agent
          ref: main
          path: Backtest_Agent
          fetch-depth: 1

      - name: Download hourly trading artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p reports-source
          gh run download "${SOURCE_RUN_ID}" \
            --name hourly-auto-trading-report \
            --dir reports-source

      - name: Build profitability funnel or upstream diagnostic
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          python scripts/run_profitability_funnel_audit.py \
            --discovery reports-source/hourly-pre-backtest-discovery.json \
            --upstream-report reports-source/hourly-auto-trading-report.json \
            --source-run-id "${SOURCE_RUN_ID}" \
            --source-run-conclusion "${SOURCE_RUN_CONCLUSION}" \
            --output reports/hourly-profitability-funnel.json \
            --markdown reports/hourly-profitability-funnel.md

      - name: Verify profitability funnel safety contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("reports/hourly-profitability-funnel.json")
          payload = json.loads(path.read_text(encoding="utf-8"))

          if payload.get("schema_version") != "profitability-funnel.v2":
              raise SystemExit("unexpected profitability funnel schema")
          if not isinstance(payload.get("stages"), list):
              raise SystemExit("profitability funnel stages must be a list")
          if not isinstance(payload.get("active_bottlenecks"), list):
              raise SystemExit("active_bottlenecks must be a list")

          safety = payload.get("safety") or {}
          expected_false = (
              "scanner_data_quality_threshold_relaxed",
              "production_opportunity_threshold_relaxed",
              "risk_thresholds_relaxed",
              "investability_thresholds_relaxed",
              "shadow_broker_order_authorized",
          )
          if safety.get("purpose") != "diagnostic_only":
              raise SystemExit("profitability funnel must remain diagnostic_only")
          changed = [key for key in expected_false if safety.get(key) is not False]
          if changed:
              raise SystemExit(
                  "diagnostic safety contract violated: " + ", ".join(changed)
              )

          health = payload.get("health") or {}
          primary = payload.get("primary_bottleneck") or {}
          print(
              "Profitability funnel verified: "
              f"production_candidates={health.get('production_candidate_count', 0)}, "
              f"research_candidates={health.get('research_candidate_count', 0)}, "
              f"primary_bottleneck={primary.get('stage', 'none')}"
          )
          PY

      - name: Publish profitability funnel to workflow summary
        if: always()
        run: |
          if [ -f reports/hourly-profitability-funnel.md ]; then
            cat reports/hourly-profitability-funnel.md >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "# Hourly Profitability Funnel Audit"
              echo
              echo "The funnel report was not generated. Inspect the audit job failure and the source Hourly Auto Trading artifact."
              echo
              echo "Source run: \`${{ github.event.workflow_run.id }}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Build Backtest nested training gate diagnostic
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ -f reports-source/hourly-backtest-console.json ]; then
            python -m pip install --disable-pip-version-check -r Backtest_Agent/requirements.txt
            PYTHONPATH="${GITHUB_WORKSPACE}/Backtest_Agent" \
              python Backtest_Agent/scripts/diagnose_nested_training_gates.py \
                --input reports-source/hourly-backtest-console.json \
                --output reports/hourly-backtest-training-gates.json \
                --markdown reports/hourly-backtest-training-gates.md
          else
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = {
              "schema_version": "nested-training-gate-diagnostics.v1",
              "status": "not_run",
              "mode": "diagnostic_only",
              "source_run_id": os.environ.get("SOURCE_RUN_ID"),
              "reason": "hourly_backtest_console_not_available",
              "aggregate": {
                  "symbol_count": 0,
                  "performance_gate_failure_counts": {},
              },
              "safety": {
                  "selection_thresholds_changed": False,
                  "backtest_rerun_performed": False,
                  "market_data_refetched": False,
                  "promotion_behavior_changed": False,
              },
          }
          Path("reports").mkdir(parents=True, exist_ok=True)
          Path("reports/hourly-backtest-training-gates.json").write_text(
              json.dumps(report, indent=2, sort_keys=True), encoding="utf-8"
          )
          Path("reports/hourly-backtest-training-gates.md").write_text(
              "# Nested Training Gate Diagnostics\n\n"
              "Backtest evidence was not available for this Hourly run. No Backtest was rerun and no market data was refetched.\n",
              encoding="utf-8",
          )
          PY
          fi

      - name: Upload profitability and Backtest diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: profitability-funnel-audit
          path: reports/
          if-no-files-found: error
          retention-days: 30
