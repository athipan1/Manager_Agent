name: Apply controlled no-trade fix once

on:
  push:
    branches:
      - fix/hourly-controlled-no-trade-reporting-20260806

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/hourly-controlled-no-trade-reporting-20260806
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python tools/apply_controlled_no_trade_patch.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install targeted test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.prod.base.txt
          python -m pip install --disable-pip-version-check pytest

      - name: Run controlled no-trade regression tests
        run: |
          python -m compileall -q \
            scripts/resolve_hourly_trade_gate.py \
            scripts/build_hourly_operator_artifact.py
          python -m pytest -q \
            tests/test_hourly_controlled_no_trade.py \
            tests/test_build_hourly_operator_artifact.py

      - name: Commit verified patch
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: treat safe no-trade cycles as intentional"
          git push origin HEAD:fix/hourly-controlled-no-trade-reporting-20260806
