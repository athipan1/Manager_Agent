name: Backtest Hourly Database E2E Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  BACKTEST_MODE: nested_promotion
  BACKTEST_ENVIRONMENT: production
  BACKTEST_ACCOUNT_ID: '1'
  BACKTEST_SYMBOL: AAPL
  BACKTEST_SYMBOLS: NVDA,MSFT,META,AVGO,GOOGL,AMZN,JPM,XOM,COST,LLY
  BACKTEST_MAX_SYMBOLS: '10'
  BACKTEST_SKILL_ID: ${{ vars.BACKTEST_SKILL_ID || 'hourly-sma-crossover' }}
  BACKTEST_STRATEGY_ID: ${{ vars.BACKTEST_STRATEGY_ID || 'hourly-sma-crossover' }}
  BACKTEST_TIMEFRAME: ${{ vars.BACKTEST_TIMEFRAME || '1d' }}
  BACKTEST_MINIMUM_BARS: ${{ vars.BACKTEST_MINIMUM_BARS || '252' }}
  BACKTEST_BAR_LIMIT: ${{ vars.BACKTEST_BAR_LIMIT || '10000' }}
  BACKTEST_INITIAL_EQUITY: ${{ vars.BACKTEST_INITIAL_EQUITY || '100000' }}
  BACKTEST_STRATEGY: ${{ vars.BACKTEST_STRATEGY || 'sma_crossover' }}
  BACKTEST_FAST_WINDOW: ${{ vars.BACKTEST_FAST_WINDOW || '2' }}
  BACKTEST_SLOW_WINDOW: ${{ vars.BACKTEST_SLOW_WINDOW || '3' }}
  BACKTEST_FEE_BPS: ${{ vars.BACKTEST_FEE_BPS || '10' }}
  BACKTEST_SLIPPAGE_BPS: ${{ vars.BACKTEST_SLIPPAGE_BPS || '5' }}
  BACKTEST_RISK_PER_TRADE: ${{ vars.BACKTEST_RISK_PER_TRADE || '0.01' }}
  BACKTEST_MAX_POSITION_PCT: ${{ vars.BACKTEST_MAX_POSITION_PCT || '0.10' }}
  BACKTEST_STOP_LOSS_PCT: ${{ vars.BACKTEST_STOP_LOSS_PCT || '0.03' }}
  BACKTEST_REWARD_RISK_RATIO: ${{ vars.BACKTEST_REWARD_RISK_RATIO || '2.0' }}
  BACKTEST_USE_RISK_AGENT: 'true'
  BACKTEST_MAX_TRADES_PER_DAY: '5'
  BACKTEST_EMERGENCY_HALT: 'false'
  BACKTEST_FORCE_CLOSE_AT_END: 'false'
  BACKTEST_MAX_TOTAL_EXPOSURE_PCT: '1.0'
  BACKTEST_MAX_OPEN_POSITIONS: '25'
  BACKTEST_CASH_RESERVE_PCT: '0.0'
  BACKTEST_MAX_NEW_POSITIONS_PER_BAR: '25'
  BACKTEST_PERIODS_PER_YEAR: '252'
  BACKTEST_ANNUAL_RISK_FREE_RATE: '0.0'
  BACKTEST_MAX_VOLUME_PARTICIPATION_PCT: '1.0'
  BACKTEST_MARKET_IMPACT_BPS: '0.0'
  BACKTEST_DEFAULT_BID_ASK_SPREAD_BPS: '2.0'
  BACKTEST_DEFAULT_QUANTITY_INCREMENT: '1'
  PUBLISH_TO_DATABASE: 'true'
  DATABASE_AGENT_URL: ${{ secrets.DATABASE_AGENT_URL }}
  DATABASE_AGENT_API_KEY: ${{ secrets.DATABASE_AGENT_API_KEY }}
  ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
  ALPACA_DATA_API_URL: https://data.alpaca.markets
  ALPACA_DATA_FEED: iex

jobs:
  probe:
    name: Backtest real POST and exact GET
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Manager probe
        uses: actions/checkout@v6

      - name: Checkout Backtest_Agent main
        uses: actions/checkout@v6
        with:
          repository: athipan1/Backtest_Agent
          ref: main
          path: Backtest_Agent
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backtest_Agent/requirements-dev.txt

      - name: Install Backtest dependencies
        working-directory: Backtest_Agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify Alpaca Market Data credentials
        working-directory: Backtest_Agent
        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request

          key = os.getenv('ALPACA_API_KEY_ID', '').strip()
          secret = os.getenv('ALPACA_SECRET_KEY', '').strip()
          if not key or not secret:
              raise SystemExit('Manager_Agent Alpaca secrets are not configured')
          params = urllib.parse.urlencode({
              'symbols': 'AAPL',
              'timeframe': '1Day',
              'limit': 1,
              'feed': 'iex',
          })
          request = urllib.request.Request(
              f'https://data.alpaca.markets/v2/stocks/bars?{params}',
              headers={
                  'APCA-API-KEY-ID': key,
                  'APCA-API-SECRET-KEY': secret,
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status != 200:
                  raise SystemExit(f'Alpaca Market Data probe failed: HTTP {response.status}')
          print('Alpaca Market Data credentials accepted')
          PY

      - name: Verify Database_Agent readiness
        working-directory: Backtest_Agent
        run: |
          python - <<'PY'
          import httpx
          from app.database_client import DatabaseAgentClient

          client = DatabaseAgentClient()
          if not client.base_url or not client.api_key.strip():
              raise SystemExit('Database_Agent credentials are not configured')
          response = httpx.get(f'{client.base_url}/ready', timeout=20.0)
          response.raise_for_status()
          body = response.json()
          if body.get('status') != 'success' or not (body.get('data') or {}).get('ready'):
              raise SystemExit(f'Database_Agent not ready: {body}')
          print('Database_Agent ready')
          PY

      - name: Run Backtest Hourly production path
        working-directory: Backtest_Agent
        run: python scripts/run_hourly_backtest.py

      - name: Verify POST and exact GET identity
        working-directory: Backtest_Agent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import httpx
          from app.database_client import DatabaseAgentClient

          report_path = Path('reports/hourly-backtest-result.json')
          if not report_path.exists():
              raise SystemExit('Hourly Backtest report missing')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          data = report.get('data') or {}
          items = data.get('items') or []
          published = [item for item in items if item.get('published') is True and item.get('run_id')]
          if not published:
              diagnostic = {
                  'status': report.get('status'),
                  'runtime': report.get('runtime'),
                  'publish_status': data.get('publish_status'),
                  'eligible_symbols': data.get('eligible_symbols'),
                  'ineligible_symbols': data.get('ineligible_symbols'),
                  'failed_symbols': data.get('failed_symbols'),
                  'items': [
                      {
                          'symbol': item.get('symbol'),
                          'status': item.get('status'),
                          'publish_status': item.get('publish_status'),
                          'error': item.get('error'),
                      }
                      for item in items
                  ],
              }
              Path('reports/hourly-backtest-database-e2e.json').write_text(
                  json.dumps(diagnostic, indent=2, sort_keys=True), encoding='utf-8'
              )
              raise SystemExit('No published Backtest run; see E2E diagnostic artifact')

          client = DatabaseAgentClient()
          headers = {
              'X-API-KEY': client.api_key,
              'X-Correlation-ID': report.get('correlation_id') or 'manager-backtest-e2e',
          }
          verified = []
          for item in published:
              run_id = item['run_id']
              response = httpx.get(
                  f'{client.base_url}/backtests/runs/{run_id}',
                  headers=headers,
                  timeout=30.0,
              )
              if response.status_code != 200:
                  raise SystemExit(
                      f'Exact GET failed for {run_id}: HTTP {response.status_code}: {response.text[:500]}'
                  )
              document = response.json()
              persisted = (document.get('data') or {}).get('run') or {}
              payload = item.get('database_payload') or {}
              expected = {
                  'run_id': run_id,
                  'symbol': item.get('symbol'),
                  'strategy_id': item.get('selected_strategy_id'),
                  'timeframe': payload.get('timeframe'),
              }
              actual = {
                  'run_id': persisted.get('run_id'),
                  'symbol': persisted.get('symbol'),
                  'strategy_id': persisted.get('strategy_id'),
                  'timeframe': persisted.get('timeframe'),
              }
              if document.get('status') != 'success' or expected != actual:
                  raise SystemExit(
                      f'Persisted run identity mismatch: expected={expected} actual={actual}'
                  )
              verified.append({
                  **actual,
                  'post_published': True,
                  'exact_get_http_status': response.status_code,
                  'exact_identity_match': True,
              })

          evidence = {
              'status': 'success',
              'correlation_id': report.get('correlation_id'),
              'runtime': report.get('runtime'),
              'verified_count': len(verified),
              'verified': verified,
          }
          Path('reports/hourly-backtest-database-e2e.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True), encoding='utf-8'
          )
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Upload Backtest E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backtest-hourly-database-e2e-${{ github.run_id }}
          path: Backtest_Agent/reports/
          if-no-files-found: warn
          retention-days: 30
