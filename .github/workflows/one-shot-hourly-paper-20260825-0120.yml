name: One-shot Hourly Alpaca Paper 2026-08-25 01:20 ICT

on:
  push:
    branches:
      - run/hourly-paper-20260825-0120

permissions:
  contents: read
  issues: read

jobs:
  hourly:
    uses: ./.github/workflows/hourly-auto-trading.yml
    with:
      dry_run: false
      broker_mode: ALPACA
      max_universe: "1000"
      top_n: "10"
      min_final_score: "0.55"
      operator_confirmation: EXECUTE_ALPACA_PAPER
      emergency_halt_drill: false
      authorized_soak_schedule: false
    secrets: inherit
