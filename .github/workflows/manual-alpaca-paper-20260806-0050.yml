name: Manual Alpaca Paper Once

on:
  push:
    branches:
      - ops/manual-alpaca-paper-20260806-0050

permissions:
  contents: read
  issues: read

jobs:
  run-hourly-alpaca-paper:
    uses: ./.github/workflows/hourly-auto-trading.yml
    with:
      dry_run: false
      broker_mode: ALPACA
      max_universe: "100"
      top_n: "10"
      min_final_score: "0.55"
      operator_confirmation: "EXECUTE_ALPACA_PAPER"
      emergency_halt_drill: true
      authorized_soak_schedule: false
    secrets: inherit
