name: Temporary Hourly Paper Probe

on:
  push:
    branches:
      - ops/hourly-paper-probe-20260819
    paths:
      - .github/workflows/temp-hourly-paper-probe.yml

permissions:
  contents: read
  issues: read

jobs:
  run-hourly-auto-trading:
    uses: ./.github/workflows/hourly-auto-trading.yml
    with:
      dry_run: false
      broker_mode: ALPACA
      max_universe: "1000"
      top_n: "10"
      min_final_score: "0.55"
      operator_confirmation: EXECUTE_ALPACA_PAPER
      emergency_halt_drill: false
      authorized_soak_schedule: false
    secrets: inherit
