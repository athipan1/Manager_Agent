name: Publish Dashboard Snapshot

on:
  workflow_run:
    workflows:
      - Hourly Auto Trading
      - Alpaca Paper Soak
      - Manual Alpaca Paper Trading
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional artifact-producing run ID; latest valid run is used when empty"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-dashboard-snapshot.yml"
      - "scripts/build_dashboard_fallback_report.py"
      - "scripts/build_hourly_operator_artifact.py"
      - "scripts/capture_hourly_dashboard_state.py"
      - "scripts/export_dashboard_snapshot.py"

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-dashboard-snapshot-dashboard-data
  cancel-in-progress: false

jobs:
  publish-dashboard-snapshot:
    runs-on: ubuntu-latest
    env:
      DASHBOARD_SNAPSHOT_PRIVACY_MODE: ${{ vars.DASHBOARD_SNAPSHOT_PRIVACY_MODE || 'masked' }}
    steps:
      - name: Checkout Manager source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Checkout persistent dashboard data branch
        uses: actions/checkout@v4
        with:
          ref: dashboard-data
          path: dashboard-data
          fetch-depth: 0

      - name: Resolve latest artifact-producing Paper run
        id: hourly_run
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.run_id || '' }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail

          has_hourly_artifact() {
            local candidate="$1"
            [ -n "$candidate" ] || return 1
            [ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/artifacts" \
              --jq '[.artifacts[] | select(.name == "hourly-auto-trading-report" and (.expired | not))] | length')" -gt 0 ]
          }

          run_id="${REQUESTED_RUN_ID:-${EVENT_RUN_ID:-}}"
          artifact_found=false
          if has_hourly_artifact "$run_id"; then
            artifact_found=true
          else
            latest_artifact_run=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=hourly-auto-trading-report&per_page=100" \
              --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
            if has_hourly_artifact "$latest_artifact_run"; then
              run_id="$latest_artifact_run"
              artifact_found=true
            fi
          fi

          if [ -z "$run_id" ]; then
            run_id=$(gh run list \
              --workflow "Hourly Auto Trading" \
              --branch main \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
          fi
          if [ -z "$run_id" ]; then
            echo "No completed Paper workflow run was found."
            exit 1
          fi

          mkdir -p source/reports
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
            --jq '{runId: .id, runNumber: .run_number, runUrl: .html_url, workflowName: .name, eventName: .event, status: .status, conclusion: (.conclusion // "unknown"), startedAt: .run_started_at, completedAt: .updated_at}' \
            > source/reports/workflow-metadata.json
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_found=$artifact_found" >> "$GITHUB_OUTPUT"

      - name: Download verified hourly report artifact
        id: download
        if: steps.hourly_run.outputs.artifact_found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.hourly_run.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p source/reports/hourly-artifact
          gh run download "$RUN_ID" \
            --name hourly-auto-trading-report \
            --dir source/reports/hourly-artifact

      - name: Build retained fallback report when no artifact exists
        if: steps.hourly_run.outputs.artifact_found != 'true'
        working-directory: source
        run: |
          mkdir -p reports/hourly-artifact
          python scripts/build_dashboard_fallback_report.py \
            --previous ../dashboard-data/docs/dashboard/latest-dashboard-snapshot.json \
            --workflow-metadata reports/workflow-metadata.json \
            --output reports/hourly-artifact/hourly-auto-trading-report.json

      - name: Export frontend-safe snapshot v2
        working-directory: source
        run: |
          set -euo pipefail
          input_path=$(find reports/hourly-artifact -type f -name hourly-auto-trading-report.json -print -quit 2>/dev/null || true)
          if [ -z "$input_path" ]; then
            echo "Resolved Paper run did not provide a usable operator artifact."
            exit 1
          fi
          python scripts/export_dashboard_snapshot.py \
            --input "$input_path" \
            --workflow-metadata reports/workflow-metadata.json \
            --previous ../dashboard-data/docs/dashboard/latest-dashboard-snapshot.json \
            --output reports/latest-dashboard-snapshot.json \
            --privacy-mode "$DASHBOARD_SNAPSHOT_PRIVACY_MODE" \
            --expected-interval-minutes 60 \
            --stale-after-minutes 120
          mkdir -p ../dashboard-data/docs/dashboard
          cp reports/latest-dashboard-snapshot.json ../dashboard-data/docs/dashboard/latest-dashboard-snapshot.json

      - name: Validate public snapshot contract
        working-directory: source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path('reports/latest-dashboard-snapshot.json').read_text(encoding='utf-8')
          )
          assert payload['schemaVersion'] == 'dashboard-snapshot.v2'
          assert payload['runtime']['liveTradingEnabled'] is False
          assert payload['runtime']['mode'] in {'PAPER', 'SIMULATOR'}
          assert 'error' in payload and 'freshness' in payload and 'lastSuccessfulRun' in payload
          forbidden = (
              'authorization', 'github_token', 'operator_token', 'api_key',
              'secret_key', 'password', 'client_order_id'
          )
          serialized = json.dumps(payload).lower()
          assert not any(item in serialized for item in forbidden)
          PY

      - name: Commit snapshot to dashboard-data with bounded retry
        working-directory: dashboard-data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard/latest-dashboard-snapshot.json
          if git diff --cached --quiet; then
            echo "No dashboard snapshot changes to publish."
            exit 0
          fi
          git commit -m "chore: publish latest dashboard snapshot [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin dashboard-data
            if git push origin HEAD:dashboard-data; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Snapshot push failed after bounded retries."
          exit 1

      - name: Upload generated dashboard snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-dashboard-snapshot
          path: source/reports/latest-dashboard-snapshot.json
          if-no-files-found: warn
          retention-days: 30
