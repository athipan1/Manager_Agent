name: Publish Dashboard Snapshot

on:
  workflow_run:
    workflows:
      - Hourly Auto Trading
      - Alpaca Paper Soak
      - Manual Alpaca Paper Trading
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional artifact-producing run ID; latest valid run is used when empty"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-dashboard-snapshot.yml"
      - "scripts/build_dashboard_fallback_report.py"
      - "scripts/build_hourly_operator_artifact.py"
      - "scripts/capture_hourly_dashboard_state.py"
      - "scripts/normalize_hourly_operator_report.py"
      - "scripts/export_dashboard_snapshot.py"
      - "scripts/enrich_dashboard_snapshot.py"
      - "scripts/enrich_trading_observability.py"
      - "scripts/enrich_decision_history.py"

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-dashboard-snapshot-dashboard-data
  cancel-in-progress: false

jobs:
  publish-dashboard-snapshot:
    runs-on: ubuntu-latest
    env:
      # This workflow publishes to a public branch. Keep privacy fail-closed and
      # do not allow repository variables to promote the snapshot to full mode.
      PUBLIC_DASHBOARD_SNAPSHOT_PRIVACY_MODE: masked
    steps:
      - name: Checkout Manager source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Checkout persistent dashboard data branch
        uses: actions/checkout@v4
        with:
          ref: dashboard-data
          path: dashboard-data
          fetch-depth: 0

      - name: Resolve triggering Paper run
        id: hourly_run
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.run_id || '' }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail

          has_hourly_artifact() {
            local candidate="$1"
            [ -n "$candidate" ] || return 1
            [ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/artifacts" \
              --jq '[.artifacts[] | select(.name == "hourly-auto-trading-report" and (.expired | not))] | length')" -gt 0 ]
          }

          run_id=""
          artifact_found=false
          run_is_authoritative=false

          # A workflow_run event must publish that exact run. Never replace a
          # skipped, failed or artifact-less current run with an older artifact,
          # otherwise the public dashboard stops advancing every hour.
          if [ -n "${EVENT_RUN_ID:-}" ]; then
            run_id="$EVENT_RUN_ID"
            run_is_authoritative=true
          elif [ -n "${REQUESTED_RUN_ID:-}" ]; then
            run_id="$REQUESTED_RUN_ID"
            run_is_authoritative=true
          else
            latest_artifact_run=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=hourly-auto-trading-report&per_page=100" \
              --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
            if has_hourly_artifact "$latest_artifact_run"; then
              run_id="$latest_artifact_run"
              artifact_found=true
            fi
          fi

          if [ "$artifact_found" != true ] && has_hourly_artifact "$run_id"; then
            artifact_found=true
          fi

          if [ -z "$run_id" ]; then
            run_id=$(gh run list \
              --workflow "Hourly Auto Trading" \
              --branch main \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            run_is_authoritative=true
            if has_hourly_artifact "$run_id"; then
              artifact_found=true
            fi
          fi
          if [ -z "$run_id" ]; then
            echo "No completed Paper workflow run was found."
            exit 1
          fi

          mkdir -p source/reports
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
            --jq '{runId: .id, runNumber: .run_number, runUrl: .html_url, workflowName: .name, eventName: .event, status: .status, conclusion: (.conclusion // "unknown"), startedAt: .run_started_at, completedAt: .updated_at}' \
            > source/reports/workflow-metadata.json
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_found=$artifact_found" >> "$GITHUB_OUTPUT"
          echo "run_is_authoritative=$run_is_authoritative" >> "$GITHUB_OUTPUT"

      - name: Download verified hourly report artifact
        id: download
        if: steps.hourly_run.outputs.artifact_found == 'true'
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.hourly_run.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p reports/hourly-artifact
          gh run download "$RUN_ID" \
            --name hourly-auto-trading-report \
            --dir reports/hourly-artifact

      - name: Build current-run fallback report when no artifact exists
        if: steps.hourly_run.outputs.artifact_found != 'true'
        working-directory: source
        run: |
          mkdir -p reports/hourly-artifact
          previous_path="../dashboard-data/docs/dashboard/latest-dashboard-snapshot.json"
          if [ "${{ steps.hourly_run.outputs.run_is_authoritative }}" = "true" ]; then
            # Build a metadata-only report for the current run. The exporter still
            # receives the previous snapshot separately and preserves lastSuccessfulRun.
            previous_path="reports/current-run-no-previous-snapshot.json"
          fi
          python scripts/build_dashboard_fallback_report.py \
            --previous "$previous_path" \
            --workflow-metadata reports/workflow-metadata.json \
            --output reports/hourly-artifact/hourly-auto-trading-report.json

      - name: Normalize, export, and enrich frontend-safe snapshot v2
        working-directory: source
        run: |
          set -euo pipefail
          input_path=$(find reports/hourly-artifact -type f -name hourly-auto-trading-report.json -print -quit 2>/dev/null || true)
          if [ -z "$input_path" ]; then
            echo "Resolved Paper run did not provide a usable operator artifact."
            exit 1
          fi
          python scripts/normalize_hourly_operator_report.py \
            --input "$input_path" \
            --output reports/normalized-hourly-auto-trading-report.json
          python scripts/export_dashboard_snapshot.py \
            --input reports/normalized-hourly-auto-trading-report.json \
            --workflow-metadata reports/workflow-metadata.json \
            --previous ../dashboard-data/docs/dashboard/latest-dashboard-snapshot.json \
            --output reports/latest-dashboard-snapshot.json \
            --privacy-mode "$PUBLIC_DASHBOARD_SNAPSHOT_PRIVACY_MODE" \
            --expected-interval-minutes 60 \
            --stale-after-minutes 120
          python scripts/enrich_dashboard_snapshot.py \
            --snapshot reports/latest-dashboard-snapshot.json \
            --artifact-dir reports/hourly-artifact \
            --previous ../dashboard-data/docs/dashboard/latest-dashboard-snapshot.json
          python scripts/enrich_trading_observability.py \
            --snapshot reports/latest-dashboard-snapshot.json \
            --artifact-dir reports/hourly-artifact \
            --previous ../dashboard-data/docs/dashboard/latest-dashboard-snapshot.json
          python scripts/enrich_decision_history.py \
            --snapshot reports/latest-dashboard-snapshot.json \
            --artifact-dir reports/hourly-artifact \
            --previous ../dashboard-data/docs/dashboard/latest-dashboard-snapshot.json
          mkdir -p ../dashboard-data/docs/dashboard
          cp reports/latest-dashboard-snapshot.json ../dashboard-data/docs/dashboard/latest-dashboard-snapshot.json

      - name: Validate public snapshot contract
        working-directory: source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path('reports/latest-dashboard-snapshot.json').read_text(encoding='utf-8')
          )
          assert payload['schemaVersion'] == 'dashboard-snapshot.v2'
          assert payload['runtime']['liveTradingEnabled'] is False
          assert payload['runtime']['mode'] in {'PAPER', 'SIMULATOR'}
          assert 'error' in payload and 'freshness' in payload and 'lastSuccessfulRun' in payload
          assert isinstance(payload.get('agents'), list)
          assert 'risk' in payload
          assert isinstance(payload.get('backtest'), dict)
          assert set(payload['backtest']) == {'latestRun', 'history'}
          observability = payload.get('observability')
          assert isinstance(observability, dict)
          assert observability.get('schemaVersion') == 'trading-observability.v1'
          current = observability.get('current')
          assert isinstance(current, dict)
          assert current.get('flowKind') == 'decision_path'
          assert [stage.get('id') for stage in current.get('stages', [])] == [
              'scanner', 'backtest', 'market_regime', 'portfolio', 'profit', 'risk', 'execution'
          ]
          assert len(current.get('candidates', [])) <= 10
          last_meaningful = observability.get('lastMeaningful')
          assert last_meaningful is None or isinstance(last_meaningful, dict)
          decision_history = payload.get('decisionHistory')
          assert isinstance(decision_history, dict)
          assert decision_history.get('schemaVersion') == 'decision-history.v1'
          assert decision_history.get('retentionCycles') == 24
          assert isinstance(decision_history.get('cycles'), list)
          assert 1 <= len(decision_history['cycles']) <= 24
          assert all(cycle.get('flowKind') == 'decision_path' for cycle in decision_history['cycles'])
          assert all(len(cycle.get('candidates', [])) <= 10 for cycle in decision_history['cycles'])
          assert payload['privacy'] == {'mode': 'masked', 'valuesMasked': True}
          assert payload['account']['valuesMasked'] is True
          assert payload['account']['cash'] is None
          assert payload['account']['equity'] is None
          assert payload['account']['buyingPower'] is None
          assert all(item.get('valuesMasked') is True for item in payload['positions'])
          assert all(item.get('valuesMasked') is True for item in payload['openOrders'])
          forbidden = (
              'authorization', 'github_token', 'operator_token', 'api_key',
              'secret_key', 'password', 'client_order_id'
          )
          serialized = json.dumps(payload).lower()
          assert not any(item in serialized for item in forbidden)
          PY

      - name: Commit snapshot to dashboard-data with bounded retry
        working-directory: dashboard-data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard/latest-dashboard-snapshot.json
          if git diff --cached --quiet; then
            echo "No dashboard snapshot changes to publish."
            exit 0
          fi
          git commit -m "chore: publish latest dashboard snapshot [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin dashboard-data
            if git push origin HEAD:dashboard-data; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Snapshot push failed after bounded retries."
          exit 1

      - name: Upload generated dashboard snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-dashboard-snapshot
          path: source/reports/latest-dashboard-snapshot.json
          if-no-files-found: warn
          retention-days: 30
