name: Manual Alpaca Paper Trading
run-name: Manual Alpaca Paper · ${{ github.actor }} · #${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Enter EXECUTE_ALPACA_PAPER"
        required: true
        type: string
      max_universe:
        description: "Maximum Scanner universe"
        required: false
        default: "1000"
        type: string
      top_n:
        description: "Candidate count passed to exact Backtest"
        required: false
        default: "10"
        type: string
      min_final_score:
        description: "Minimum Manager opportunity score"
        required: false
        default: "0.55"
        type: string

permissions:
  contents: read
  issues: write

jobs:
  operator-safety-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      confirmation: ${{ steps.confirm.outputs.value }}
    steps:
      - name: Checkout Manager_Agent
        uses: actions/checkout@v4

      - name: Require main and explicit Paper confirmation
        id: confirm
        env:
          OPERATOR_CONFIRMATION: ${{ inputs.confirmation }}
          PRODUCTION_SCHEDULE_ENABLED: ${{ vars.HOURLY_PAPER_SCHEDULE_ENABLED }}
          BROKER_MODE: ALPACA
          DRY_RUN: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Manual Alpaca Paper execution is allowed only from main."
            exit 1
          fi
          if [ "${OPERATOR_CONFIRMATION}" != "EXECUTE_ALPACA_PAPER" ]; then
            echo "Enter EXECUTE_ALPACA_PAPER to authorize Paper broker mutation."
            exit 1
          fi
          if [ "${PRODUCTION_SCHEDULE_ENABLED:-false}" = "true" ]; then
            echo "Disable HOURLY_PAPER_SCHEDULE_ENABLED before a manual validation run."
            exit 1
          fi
          python scripts/paper_trading_control.py assert-clear
          echo "value=EXECUTE_ALPACA_PAPER" >> "$GITHUB_OUTPUT"

  paper-cycle:
    needs: operator-safety-gate
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/hourly-auto-trading.yml
    with:
      dry_run: false
      broker_mode: ALPACA
      max_universe: ${{ inputs.max_universe }}
      top_n: ${{ inputs.top_n }}
      min_final_score: ${{ inputs.min_final_score }}
      operator_confirmation: ${{ needs.operator-safety-gate.outputs.confirmation }}
      emergency_halt_drill: true
    secrets: inherit

  verify-and-alert:
    if: always() && needs.operator-safety-gate.result == 'success'
    needs:
      - operator-safety-gate
      - paper-cycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Manager_Agent
        uses: actions/checkout@v4

      - name: Download Paper cycle artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hourly-auto-trading-report
          path: evidence/raw

      - name: Verify reconciliation, protection and emergency-halt evidence
        id: audit
        if: always()
        continue-on-error: true
        run: |
          python scripts/verify_paper_cycle_evidence.py \
            --artifact-dir evidence/raw \
            --output evidence/manual-paper-cycle-audit.json \
            --require-emergency-drill

      - name: Create durable operator alert when review is required
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAPER_WORKFLOW_RESULT: ${{ needs.paper-cycle.result }}
          PAPER_AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          python scripts/paper_trading_control.py alert \
            --workflow-result "${PAPER_WORKFLOW_RESULT}" \
            --audit-outcome "${PAPER_AUDIT_OUTCOME}" \
            --evidence evidence/manual-paper-cycle-audit.json \
            --run-url "${GITHUB_RUN_URL}"

      - name: Upload manual Paper evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-alpaca-paper-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 90

      - name: Fail when the broker cycle or evidence audit failed
        if: always()
        env:
          PAPER_WORKFLOW_RESULT: ${{ needs.paper-cycle.result }}
          PAPER_AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          if [ "${PAPER_WORKFLOW_RESULT}" != "success" ] || [ "${PAPER_AUDIT_OUTCOME}" != "success" ]; then
            exit 1
          fi
