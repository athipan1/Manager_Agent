name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair-soak-readiness-validator:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/curator-advisory-soak'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout soak branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}
        fetch-depth: 0

    - name: Align readiness validator with runtime contract
      run: |
        python - <<'PY'
        from pathlib import Path

        path = Path('scripts/run_curator_advisory_soak.py')
        content = path.read_text(encoding='utf-8')
        old = '''        "worker_container_mode": worker_execution.get("mode") == "container",
                "worker_network_disabled": worker_execution.get("network_access") is False,
                "worker_read_only": worker_execution.get("read_only_filesystem") is True,
                "shared_work_root_configured": (
        '''
        new = '''        "worker_container_mode": worker_execution.get("mode") == "container",
                "worker_secure_execution_ready": (
                    worker_execution.get("secure_execution_ready") is True
                ),
                "sandbox_image_available": bool(worker_execution.get("image")),
                "docker_daemon_available": bool(
                    worker_execution.get("docker_server_version")
                ),
                "shared_work_root_configured": (
        '''
        if old not in content:
            raise SystemExit('readiness validation marker was not found')
        path.write_text(content.replace(old, new, 1), encoding='utf-8')
        PY
        git checkout origin/main -- .github/workflows/ci.yml

    - name: Commit clean validator repair
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add scripts/run_curator_advisory_soak.py .github/workflows/ci.yml
        git commit -m "Align soak readiness with runtime contract"
        git push origin HEAD:${{ github.head_ref }}

  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade wheel setuptools
        pip install -r requirements.txt

    - name: Compile Python and validate hourly compose contracts
      env:
        ALPACA_API_KEY_ID: ci-paper-key
        ALPACA_SECRET_KEY: ci-paper-secret
        ALPACA_API_URL: https://paper-api.alpaca.markets
        EXECUTION_API_KEY: ci-execution-key
        DATABASE_AGENT_URL: https://database-agent.example.invalid
        DATABASE_AGENT_API_KEY: ci-database-key
        RISK_ADMIN_TOKEN: ci-risk-token
        PORTFOLIO_AGENT_API_KEY: ci-portfolio-key
        PROFIT_AGENT_API_KEY: ci-profit-key
      run: |
        python -m compileall -q .
        docker compose --profile backtest -f docker-compose.yml -f docker-compose.risk.yml -f docker-compose.alpha.yml -f docker-compose.hourly-paper.yml config --quiet
        docker compose --profile backtest -f docker-compose.yml -f docker-compose.risk.yml -f docker-compose.alpha.yml -f docker-compose.hourly-simulator.yml config --quiet

    - name: Run tests with pytest
      id: pytest
      continue-on-error: true
      run: |
        PYTHONPATH=. python -m pytest --maxfail=5 --disable-warnings -q > pytest-results.txt 2>&1

    - name: Upload pytest results
      if: always() && hashFiles('pytest-results.txt') != ''
      uses: actions/upload-artifact@v4
      with:
        name: manager-pytest-results
        path: pytest-results.txt
        if-no-files-found: error

    - name: Fail when pytest fails
      if: steps.pytest.outcome == 'failure'
      run: |
        cat pytest-results.txt
        exit 1
