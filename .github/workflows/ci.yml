name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade wheel setuptools
        pip install -r requirements.txt

    - name: Compile Python and validate hourly compose contracts
      env:
        ALPACA_API_KEY_ID: ci-paper-key
        ALPACA_SECRET_KEY: ci-paper-secret
        ALPACA_API_URL: https://paper-api.alpaca.markets
        EXECUTION_API_KEY: ci-execution-key
        DATABASE_AGENT_URL: https://database-agent.example.invalid
        DATABASE_AGENT_API_KEY: ci-database-key
        RISK_ADMIN_TOKEN: ci-risk-token
        PORTFOLIO_AGENT_API_KEY: ci-portfolio-key
        PROFIT_AGENT_API_KEY: ci-profit-key
        MARKET_REGIME_API_KEY: ci-market-regime-key
      run: |
        python -m compileall -q .
        docker compose --profile backtest -f docker-compose.yml -f docker-compose.risk.yml -f docker-compose.alpha.yml -f docker-compose.hourly-paper.yml config --quiet
        docker compose --profile backtest -f docker-compose.yml -f docker-compose.risk.yml -f docker-compose.alpha.yml -f docker-compose.hourly-simulator.yml config --quiet

    - name: Run tests with pytest
      id: pytest
      continue-on-error: true
      run: |
        PYTHONPATH=. python -m pytest --maxfail=5 --disable-warnings -q > pytest-results.txt 2>&1

    - name: Upload pytest results
      if: always() && hashFiles('pytest-results.txt') != ''
      uses: actions/upload-artifact@v7
      with:
        name: manager-pytest-results
        path: pytest-results.txt
        if-no-files-found: error

    - name: Fail when pytest fails
      if: steps.pytest.outcome == 'failure'
      run: |
        cat pytest-results.txt
        exit 1

  hourly-paper-verification:
    uses: ./.github/workflows/hourly-auto-trading.yml
    with:
      dry_run: true
      broker_mode: ALPACA
      max_universe: "1000"
      top_n: "10"
      min_final_score: "0.55"
      operator_confirmation: ""
      emergency_halt_drill: false
      authorized_soak_schedule: false
    secrets: inherit

  report-hourly-paper-verification:
    needs: hourly-paper-verification
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Download Hourly artifact
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: hourly-auto-trading-report
          path: hourly-report

      - name: Build verification summary
        env:
          HOURLY_JOB_RESULT: ${{ needs.hourly-paper-verification.result }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('hourly-report')
          scanner_symbols = []
          backtest_symbols = []
          outcomes = []
          statuses = []
          files = []

          def add_unique(target, values):
              for value in values:
                  text = str(value or '').strip().upper()
                  if text and text not in target:
                      target.append(text)

          def walk(value, path=''):
              if isinstance(value, dict):
                  for key, item in value.items():
                      child = f'{path}.{key}' if path else key
                      lowered = key.lower()
                      if lowered == 'backtest_symbols' and isinstance(item, list):
                          add_unique(backtest_symbols, item)
                      if lowered == 'outcome' and item is not None:
                          outcomes.append(str(item))
                      if lowered == 'status' and item is not None and len(statuses) < 30:
                          statuses.append(f'{child}={item}')
                      if lowered in {'pre_backtest_selected_positions', 'candidates'} and isinstance(item, list):
                          for row in item:
                              if isinstance(row, dict):
                                  symbol = row.get('symbol') or row.get('ticker')
                                  if symbol:
                                      add_unique(scanner_symbols, [symbol])
                      walk(item, child)
              elif isinstance(value, list):
                  for idx, item in enumerate(value):
                      walk(item, f'{path}[{idx}]')

          if root.exists():
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      files.append(str(path.relative_to(root)))
                      if path.suffix.lower() == '.json':
                          try:
                              data = json.loads(path.read_text(encoding='utf-8'))
                          except Exception:
                              continue
                          walk(data)
                          if 'backtest' in path.name.lower():
                              if isinstance(data, dict):
                                  for key in ('symbol', 'ticker'):
                                      if data.get(key):
                                          add_unique(backtest_symbols, [data[key]])

          result = os.environ.get('HOURLY_JOB_RESULT', 'unknown')
          lines = [
              '### One-shot Hourly Paper verification',
              f'- Hourly reusable job: **{result}**',
              f'- Scanner candidate symbols detected: **{", ".join(scanner_symbols) if scanner_symbols else "<none detected>"}**',
              f'- Exact Backtest symbols detected: **{", ".join(backtest_symbols) if backtest_symbols else "<none detected>"}**',
              f'- Outcomes: **{", ".join(dict.fromkeys(outcomes)) if outcomes else "<none detected>"}**',
              f'- Artifact files: `{", ".join(files) if files else "<artifact unavailable>"}`',
          ]
          if statuses:
              lines.append('- Status samples: `' + ' | '.join(statuses[:12]) + '`')
          lines.append('')
          lines.append('Verification branch only. This PR must not be merged.')
          Path('hourly-verification-summary.md').write_text('\n'.join(lines), encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Comment verification result on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          body = Path('hourly-verification-summary.md').read_text(encoding='utf-8')
          Path('comment.json').write_text(json.dumps({'body': body}), encoding='utf-8')
          PY
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --data-binary @comment.json
