name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair-agent-contract-readiness:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/curator-secret-readiness'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout PR branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}
        fetch-depth: 0

    - name: Patch truthful Curator readiness contract
      run: |
        python - <<'PY'
        from pathlib import Path

        path = Path('.github/workflows/docker-compose-e2e.yml')
        content = path.read_text(encoding='utf-8')

        old_environment = '''                CURATOR_DB_PATH: /data/curator_skills.sqlite3
                CURATOR_REQUIRE_DATABASE_TELEMETRY: "false"
'''
        new_environment = '''                CURATOR_DB_PATH: /data/curator_skills.sqlite3
                CURATOR_REQUIRE_DATABASE_TELEMETRY: "false"
                # This broad API-contract stack handles only trusted fixtures.
                # Secure untrusted execution is proved separately by
                # curator-secret-readiness.yml on the Docker host.
                CURATOR_CONTAINER_SANDBOX_ENABLED: "false"
                CURATOR_CONTAINER_SANDBOX_FALLBACK: "false"
'''

        old_assertion = '''          curator_ready_data = curator_ready.get("data") or {}
          assert curator_ready_data.get("ready") is True, curator_ready
'''
        new_assertion = '''          curator_ready_data = curator_ready.get("data") or {}
          assert curator_ready_data.get("ready") is True, curator_ready
          curator_execution = curator_ready_data.get("execution") or {}
          assert curator_execution.get("mode") == "process", curator_ready
          assert curator_execution.get("secure_execution_ready") is False, curator_ready
          assert curator_execution.get("degraded") is True, curator_ready
          assert curator_execution.get("fallback_enabled") is False, curator_ready
'''

        if old_environment not in content:
            raise SystemExit('Curator compose environment marker was not found')
        if old_assertion not in content:
            raise SystemExit('Curator readiness assertion marker was not found')

        path.write_text(
            content.replace(old_environment, new_environment, 1).replace(
                old_assertion,
                new_assertion,
                1,
            ),
            encoding='utf-8',
        )
        PY
        git rm .github/workflows/patch-agent-contract-readiness.yml
        git checkout origin/main -- .github/workflows/ci.yml

    - name: Commit clean repair to PR branch
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .github/workflows/docker-compose-e2e.yml .github/workflows/ci.yml
        git commit -m "Fix Agent Contract Curator readiness mode"
        git push origin HEAD:${{ github.head_ref }}

  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade wheel setuptools
        pip install -r requirements.txt

    - name: Compile Python and validate hourly compose contracts
      env:
        ALPACA_API_KEY_ID: ci-paper-key
        ALPACA_SECRET_KEY: ci-paper-secret
        ALPACA_API_URL: https://paper-api.alpaca.markets
        EXECUTION_API_KEY: ci-execution-key
        DATABASE_AGENT_URL: https://database-agent.example.invalid
        DATABASE_AGENT_API_KEY: ci-database-key
        RISK_ADMIN_TOKEN: ci-risk-token
        PORTFOLIO_AGENT_API_KEY: ci-portfolio-key
        PROFIT_AGENT_API_KEY: ci-profit-key
      run: |
        python -m compileall -q .
        docker compose --profile backtest -f docker-compose.yml -f docker-compose.risk.yml -f docker-compose.alpha.yml -f docker-compose.hourly-paper.yml config --quiet
        docker compose --profile backtest -f docker-compose.yml -f docker-compose.risk.yml -f docker-compose.alpha.yml -f docker-compose.hourly-simulator.yml config --quiet

    - name: Run tests with pytest
      id: pytest
      continue-on-error: true
      run: |
        PYTHONPATH=. python -m pytest --maxfail=5 --disable-warnings -q > pytest-results.txt 2>&1

    - name: Upload pytest results
      if: always() && hashFiles('pytest-results.txt') != ''
      uses: actions/upload-artifact@v4
      with:
        name: manager-pytest-results
        path: pytest-results.txt
        if-no-files-found: error

    - name: Fail when pytest fails
      if: steps.pytest.outcome == 'failure'
      run: |
        cat pytest-results.txt
        exit 1
